      <style>
        html, body { height: 100%; margin: 0; }

        /* Completely hide Google Translate top banner & floating popups */
        .goog-te-banner-frame,
        .goog-te-banner-frame.skiptranslate,
        iframe.goog-te-banner-frame,
        iframe[class*="goog-te-banner-frame"],
        iframe[id*=":1.container"],
        iframe[id*="container"],
        iframe.VIpgJd-ZVi9od-ORHb-OEVmcd,
        iframe.VIpgJd-ZVi9od-xl07Ob-OEVmcd,
        iframe.skiptranslate,
        .goog-te-balloon-frame,
        #goog-gt-tt,
        .VIpgJd-yAWNEb-L7lbkb,
        .VIpgJd-yAWNEb-hvhgNd,
        .goog-te-spinner-pos {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          width: 0 !important;
          opacity: 0 !important;
          pointer-events: none !important;
          position: absolute !important;
          left: -9999px !important;
          top: -9999px !important;
        }

        /* Prevent Google Translate from pushing the body down */
        body {
          top: 0px !important;
          position: static !important;
        }

        /* Remove Google Translate word highlight boxes */
        font[style] {
          background-color: transparent !important;
          box-shadow: none !important;

      <!-- Google tag (gtag.js) -->

      <!-- PWA Service Worker Registration -->
      <script>
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(registration) {
              console.log('[JotMinds PWA] ServiceWorker registered with scope: ', registration.scope);
              registration.update();
            }, function(err) {
              console.log('[JotMinds PWA] ServiceWorker registration failed: ', err);
            });

    <body>

      <!-- Google Translate Mount & Initialization -->
      <div id="google_translate_element" style="position:fixed;bottom:-200px;left:0;opacity:0.01;pointer-events:none;z-index:-1;"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          try {
            new google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,fr,es,ak,tw,ee,ga,gaa,ha,ar,sw',
              autoDisplay: false
            }, 'google_translate_element');
          } catch (e) {
            console.warn('[Translate] Init error:', e);
          }
        }
      </script>
      <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

      <!-- Permanent Banner Suppression Engine -->
      <script type="text/javascript">
        (function() {
          function suppress() {
            try {
              if (document.body) {
                if (document.body.style.top && document.body.style.top !== '0px') {
                  document.body.style.setProperty('top', '0px', 'important');
                }
                if (document.body.style.position === 'relative') {
                  document.body.style.setProperty('position', 'static', 'important');
                }
              }
              var nodes = document.querySelectorAll('iframe[id*="container"], iframe[class*="VIpgJd"], iframe.skiptranslate, .goog-te-banner-frame');
              for (var i = 0; i < nodes.length; i++) {
                nodes[i].style.setProperty('display', 'none', 'important');
                nodes[i].style.setProperty('visibility', 'hidden', 'important');
                nodes[i].style.setProperty('height', '0px', 'important');
                nodes[i].style.setProperty('position', 'absolute', 'important');
                nodes[i].style.setProperty('left', '-9999px', 'important');
                nodes[i].style.setProperty('top', '-9999px', 'important');
              }
            } catch(e) {}
          }

          var observer = new MutationObserver(suppress);
          if (document.documentElement) {
            observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
          }
          window.addEventListener('DOMContentLoaded', suppress);
          window.addEventListener('load', suppress);

          var count = 0;
          function rafLoop() {
            suppress();
            count++;
            if (count < 600) {
              requestAnimationFrame(rafLoop);
            }
          }
          rafLoop();
          window.addEventListener('jm-language-changed', function() {
            count = 0;
            rafLoop();
          });
          setInterval(suppress, 250);
        })();
      </script>

      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
