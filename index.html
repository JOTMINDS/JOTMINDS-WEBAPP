
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>JotMinds — Cognitive & Educational Intelligence</title>
      <meta name="description" content="AI-powered cognitive intelligence assessment, lesson planning, and educational analytics platform." />
      
      <!-- Explicit SEO & Search Engine Indexing Meta Tags -->
      <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
      <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
      <meta name="bingbot" content="index, follow" />
      <link rel="canonical" href="https://www.jotminds.com/" />

      <!-- Open Graph / Facebook / WhatsApp -->
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://www.jotminds.com/" />
      <meta property="og:title" content="JotMinds — Cognitive & Educational Intelligence" />
      <meta property="og:description" content="AI-powered cognitive intelligence assessment, lesson planning, and educational analytics platform." />
      <meta property="og:image" content="https://www.jotminds.com/logo.png" />

      <!-- Twitter Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:url" content="https://www.jotminds.com/" />
      <meta name="twitter:title" content="JotMinds — Cognitive & Educational Intelligence" />
      <meta name="twitter:description" content="AI-powered cognitive intelligence assessment, lesson planning, and educational analytics platform." />
      <meta name="twitter:image" content="https://www.jotminds.com/logo.png" />
      
      <!-- PWA Meta Tags & Manifest -->
      <link rel="manifest" href="/manifest.json" />
      <meta name="theme-color" content="#6b4c9a" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="JotMinds" />
      <link rel="apple-touch-icon" href="/logo.png" />
      <link rel="icon" type="image/png" href="/logo.png" />

      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }

        /* Completely hide Google Translate top banner & floating popups */
        .goog-te-banner-frame,
        .goog-te-banner-frame.skiptranslate,
        iframe.goog-te-banner-frame,
        iframe[class*="goog-te-banner-frame"],
        .goog-te-balloon-frame,
        #goog-gt-tt,
        .goog-te-spinner-pos {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          width: 0 !important;
          opacity: 0 !important;
          pointer-events: none !important;
        }

        /* Prevent Google Translate from pushing the body down */
        body {
          top: 0px !important;
          position: static !important;
        }

        /* Remove Google Translate word highlight boxes */
        font[style] {
          background-color: transparent !important;
          box-shadow: none !important;
        }
      </style>

      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-S8X5F4Z598"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-S8X5F4Z598');
      </script>

      <!-- PWA Service Worker Registration -->
      <script>
        if ('serviceWorker' in navigator && window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(registration) {
              console.log('[JotMinds PWA] ServiceWorker registered with scope: ', registration.scope);
            }, function(err) {
              console.log('[JotMinds PWA] ServiceWorker registration failed: ', err);
            });
          });
        }
      </script>
    </head>

    <body>

      <!-- Google Translate Mount & Initialization -->
      <div id="google_translate_element" style="position:fixed;bottom:-200px;left:0;opacity:0.01;pointer-events:none;z-index:-1;"></div>
      <script type="text/javascript">
        function googleTranslateElementInit() {
          try {
            new google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,fr,es,ak,tw,ee,ga,gaa,ha,ar,sw',
              autoDisplay: false
            }, 'google_translate_element');
          } catch (e) {
            console.warn('[Translate] Init error:', e);
          }
        }
      </script>
      <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
